<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050a18;font-family:'Montserrat','Poppins',sans-serif;color:#fff}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#hud{position:absolute;inset:0;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 60% at 50% 42%,rgba(0,0,0,0) 55%,rgba(2,6,16,.72) 100%),linear-gradient(180deg,rgba(3,8,20,.55) 0%,rgba(3,8,20,0) 16%,rgba(3,8,20,0) 62%,rgba(3,8,20,.78) 100%)}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff 0%,#bfe9ff 40%,rgba(120,200,255,0) 75%);opacity:0;mix-blend-mode:screen}
.abs{position:absolute;left:0;width:1080px;text-align:center;will-change:transform,opacity}
#top{top:150px}
#series{display:inline-block;font-weight:800;font-size:27px;letter-spacing:5px;color:#bfe6f5;padding:12px 26px;border:2px solid rgba(120,220,255,.35);border-radius:40px;background:rgba(8,22,44,.55)}
#dots{margin-top:20px;display:flex;justify-content:center;gap:9px}
#dots i{display:block;width:58px;height:9px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden}
#dots i b{display:block;height:100%;width:0;background:linear-gradient(90deg,#4de3ff,#ffd24d)}
#rank{top:292px;font-weight:900;font-size:230px;line-height:1;letter-spacing:-6px;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.6)}
#rank small{font-size:96px;font-weight:800;color:#4de3ff;vertical-align:top;position:relative;top:34px;margin-right:6px;letter-spacing:0}
#rank span{display:inline-block}
#rank.gold span{color:#ffc93c;text-shadow:0 10px 40px rgba(0,0,0,.6)}
#name{top:1066px;font-weight:900;font-size:98px;line-height:1.02;letter-spacing:-1px;text-shadow:0 6px 30px rgba(0,0,0,.75)}
#sub{top:1180px;font-weight:700;font-size:31px;letter-spacing:5px;color:#7fe6ff;text-shadow:0 3px 14px rgba(0,0,0,.8)}
#alt{top:1226px}
#altnum{font-weight:900;font-size:122px;letter-spacing:-3px;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#ffe9a8 60%,#ffc531);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(0,0,0,.7))}
#altnum em{font-style:normal;font-size:64px;font-weight:800;margin-left:10px;letter-spacing:0}
#bar{position:relative;margin:2px auto 0;width:760px;height:16px;border-radius:9px;background:rgba(255,255,255,.14);overflow:visible}
#barfill{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#2bc4ff,#7ff0ff 60%,#ffd24d);box-shadow:0 0 22px rgba(90,220,255,.8)}
#bar span{position:absolute;top:24px;font-size:22px;font-weight:700;color:rgba(255,255,255,.55);transform:translateX(-50%)}
#fact{top:978px}
#fact span{display:inline-block;font-family:'Poppins';font-weight:700;font-size:35px;padding:12px 30px;border-radius:14px;background:#ffd24d;color:#10203a;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#cap{top:1474px;white-space:nowrap;font-weight:900;font-size:66px;line-height:1.1;-webkit-text-stroke:11px #071224;paint-order:stroke fill;text-shadow:0 8px 24px rgba(0,0,0,.6)}
#cap span{display:inline-block;margin:0 19px;transform-origin:50% 80%}
#title{top:300px;font-weight:900;line-height:.98}
#title div{font-size:118px;letter-spacing:-2px;text-shadow:0 10px 50px rgba(0,0,0,.8)}
#title div:nth-child(3){font-size:176px;background:linear-gradient(180deg,#fff3b0,#ffc531 55%,#e08a00);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 10px 30px rgba(255,170,0,.4))}
#title div:nth-child(2){color:#7fe6ff}
#outro{top:330px;font-weight:900;line-height:1.02}
#outro div{font-size:86px;text-shadow:0 10px 50px rgba(0,0,0,.85)}
#outro div:nth-child(2){display:inline-block;margin-top:22px;font-size:70px;padding:14px 44px;border-radius:26px;background:#ffd24d;color:#10203a;text-shadow:none}
.pin{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#0b1d38;border:4px solid #4de3ff;font-weight:900;font-size:30px;line-height:56px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.pin.g{border-color:#ffd24d;color:#ffd24d;width:84px;height:84px;margin:-42px 0 0 -42px;line-height:76px;font-size:42px}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="hud">
  <div id="vig"></div><div id="flash"></div>
  <div id="pins"></div>
  <div class="abs" id="top"><div id="series"></div><div id="dots"></div></div>
  <div class="abs" id="rank"><small>#</small><span></span></div>
  <div class="abs" id="fact"><span></span></div>
  <div class="abs" id="name"></div>
  <div class="abs" id="sub"></div>
  <div class="abs" id="alt"><div id="altnum"></div><div id="bar"><div id="barfill"></div></div></div>
  <div class="abs" id="title"></div>
  <div class="abs" id="outro"></div>
  <div class="abs" id="cap"></div>
</div>
<script type="module" src="main.js"></script>
</body></html>
