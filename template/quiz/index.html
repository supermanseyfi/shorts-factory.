<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#070b1c;font-family:'Montserrat','Poppins','Noto Color Emoji',sans-serif;color:#fff}
#bg{position:absolute;inset:0;overflow:hidden}
#bg i{position:absolute;border-radius:50%;opacity:.6;will-change:transform}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.045) 2px,transparent 2px);background-size:90px 90px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 65% at 50% 45%,rgba(0,0,0,0) 50%,rgba(2,4,14,.7) 100%)}
.abs{position:absolute;left:0;width:1080px;text-align:center;will-change:transform,opacity}
#top{top:140px}
#series{display:inline-block;font-weight:800;font-size:28px;letter-spacing:5px;color:#dff3ff;padding:12px 28px;border:2px solid rgba(160,220,255,.4);border-radius:40px;background:rgba(8,16,40,.55)}
#dots{margin-top:20px;display:flex;justify-content:center;gap:12px}
#dots i{display:block;width:74px;height:12px;border-radius:6px;background:rgba(255,255,255,.18)}
#qlabel{top:292px;font-weight:900;font-size:40px;letter-spacing:4px;color:#ffd24d}
#qtext{top:356px;padding:0 70px;font-weight:900;font-size:70px;line-height:1.1;text-shadow:0 8px 30px rgba(0,0,0,.6)}
#timer{top:0;height:0}
#tbar{position:absolute;left:90px;width:900px;height:16px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden}
#tbar b{display:block;height:100%;width:100%;border-radius:8px;background:linear-gradient(90deg,#ff5a5a,#ffd24d 55%,#59e38f)}
#tnum{position:absolute;left:465px;top:250px;width:150px;height:150px;border-radius:50%;background:#ffd24d;color:#10203a;font-weight:900;font-size:98px;line-height:150px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#visual{position:absolute;left:0;width:1080px}
#visual svg{position:absolute;left:0;top:0}
#emoji{position:absolute;left:0;width:1080px;text-align:center;font-size:250px;line-height:1;filter:drop-shadow(0 16px 30px rgba(0,0,0,.5))}
.opt{position:absolute;left:80px;width:920px;border-radius:30px;background:rgba(14,26,58,.82);border:4px solid rgba(150,200,255,.35);display:flex;align-items:center;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.35);will-change:transform,opacity}
.opt u{text-decoration:none;flex:none;margin-left:20px;width:84px;height:84px;border-radius:22px;background:#4de3ff;color:#082033;font-weight:900;font-size:52px;line-height:84px;text-align:center}
.opt span{margin-left:30px;font-size:54px;line-height:1.05;text-align:left}
.opt em{font-style:normal;margin-left:auto;margin-right:28px;font-size:60px;font-weight:900}
.opt.ok{background:#1faa5e;border-color:#b6ffd3}.opt.ok u{background:#fff;color:#12703c}
.opt.no{background:rgba(120,30,40,.55);border-color:rgba(255,120,120,.4)}
.big{position:absolute;border-radius:40px;font-weight:900;font-size:92px;text-align:center;line-height:230px;height:230px;width:430px;border:6px solid;box-shadow:0 14px 34px rgba(0,0,0,.4);will-change:transform,opacity}
.duel{position:absolute;text-align:center;font-weight:900;will-change:transform,opacity}
.duel u{text-decoration:none;display:inline-block;width:76px;height:76px;border-radius:20px;background:#4de3ff;color:#082033;font-size:48px;line-height:76px}
.duel div{margin-top:10px;font-size:50px;line-height:1.05}
.duel small{display:block;margin-top:6px;font-size:40px;font-weight:800;color:#ffd24d}
#fact{position:absolute;left:70px;width:940px;padding:26px 34px;border-radius:28px;background:#ffd24d;color:#10203a;font-family:'Poppins';font-weight:700;font-size:44px;line-height:1.16;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#title{top:420px;font-weight:900;line-height:1}
#title div{font-size:120px;letter-spacing:-2px;text-shadow:0 10px 50px rgba(0,0,0,.8)}
#title div:nth-child(2){color:#7fe6ff}
#title div:nth-child(3){font-size:150px;background:linear-gradient(180deg,#fff3b0,#ffc531 55%,#e08a00);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
#sub{top:900px;font-weight:800;font-size:46px;letter-spacing:3px;color:#dff3ff}
#sub span{display:inline-block;padding:16px 36px;border-radius:24px;background:rgba(8,16,40,.6);border:2px solid rgba(160,220,255,.4)}
#outro{top:300px;font-weight:900;line-height:1.05}
#outro .h{font-size:88px;text-shadow:0 10px 50px rgba(0,0,0,.85)}
#outro .r{margin:26px auto 0;width:860px;display:flex;align-items:center;padding:20px 30px;border-radius:26px;background:rgba(14,26,58,.85);border:3px solid rgba(150,200,255,.35);font-size:52px}
#outro .r b{flex:none;width:210px;color:#ffd24d;font-size:62px;text-align:left}
#outro .c{display:inline-block;margin-top:40px;font-size:64px;padding:16px 44px;border-radius:26px;background:#ffd24d;color:#10203a}
#cap{top:1500px;font-weight:900;font-size:64px;line-height:1.1;white-space:nowrap;-webkit-text-stroke:11px #071224;paint-order:stroke fill}
#cap span{display:inline-block;margin:0 22px}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head>
<body>
<div id="bg"></div><div id="grid"></div><div id="vig"></div>
<div class="abs" id="top"><div id="series"></div><div id="dots"></div></div>
<div class="abs" id="qlabel"></div><div class="abs" id="qtext"></div>
<div id="tbar"><b></b></div><div id="tnum"></div>
<div id="visual"></div><div id="emoji"></div><div id="opts"></div><div id="fact"></div>
<div class="abs" id="title"></div><div class="abs" id="sub"><span></span></div><div class="abs" id="outro"></div>
<div class="abs" id="cap"></div><div id="flash"></div>
<script type="module" src="main.js"></script>
</body></html>
