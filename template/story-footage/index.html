<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050a18;font-family:'Montserrat','Poppins',sans-serif;color:#fff}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#hud{position:absolute;inset:0;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 62% at 50% 45%,rgba(0,0,0,0) 58%,rgba(2,6,16,.55) 100%),linear-gradient(180deg,rgba(3,8,20,.45) 0%,rgba(3,8,20,0) 14%,rgba(3,8,20,0) 66%,rgba(3,8,20,.7) 100%)}
#grade{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 45%,rgba(120,60,160,0) 30%,rgba(60,20,90,.55) 100%);opacity:0;mix-blend-mode:multiply}
#old{position:absolute;inset:0;background:rgba(190,140,70,.22);opacity:0;mix-blend-mode:multiply}
#dip{position:absolute;inset:0;background:#02050d;opacity:0}
.abs{position:absolute;left:0;width:1080px;text-align:center;will-change:transform,opacity}
#era{top:170px}
#era span{display:inline-block;font-weight:800;font-size:30px;letter-spacing:6px;color:#fff3cf;padding:14px 30px;border:2px solid rgba(255,220,150,.45);border-radius:40px;background:rgba(10,18,36,.55)}
#title{top:330px;font-weight:900;line-height:.98}
#title div{font-size:120px;letter-spacing:-2px;text-shadow:0 10px 50px rgba(0,0,0,.85)}
#title div:nth-child(3){font-size:190px;background:linear-gradient(180deg,#fff3b0,#ffc531 55%,#e08a00);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
#title div:nth-child(2){color:#ffe2b0}
#outro{top:330px;font-weight:900;line-height:1.04}
#outro div{font-size:78px;text-shadow:0 10px 50px rgba(0,0,0,.85)}
#outro div:nth-child(2){display:inline-block;margin-top:22px;font-size:70px;padding:14px 44px;border-radius:26px;background:#ffd24d;color:#10203a;text-shadow:none}
#cap{top:1440px;font-weight:900;font-size:72px;line-height:1.1;white-space:nowrap;-webkit-text-stroke:12px #071224;paint-order:stroke fill;text-shadow:0 8px 24px rgba(0,0,0,.6)}
#cap span{display:inline-block;margin:0 25px;transform-origin:50% 80%}
</style></head>
<body>
<img id="bg" style="position:absolute;left:0;top:0;width:1080px;height:1920px">
<div id="hud"><div id="grade"></div><div id="old"></div><div id="vig"></div>
<div class="abs" id="era"><span></span></div>
<div class="abs" id="title"></div><div class="abs" id="outro"></div>
<div class="abs" id="cap"></div><div id="dip"></div></div>
<script type="module" src="main.js"></script>
</body></html>
